{% extends "base.html" %}
{% block title %}Admin · {{ 'Edit' if p and p.id else 'New' }} product — VOLTA{% endblock %}
{% block content %}
<p class="crumbs mono"><a href="{{ url_for('admin.products') }}">Products</a> / {{ 'Edit' if p and p.id else 'New' }}</p>
<section class="auth-card wide">
  <h1>{{ 'Edit product' if p and p.id else 'New product' }}</h1>
  <form method="post">
    <label>Name <input name="name" value="{{ p.name if p else '' }}" required></label>
    <div class="form-row">
      <label>SKU <input name="sku" value="{{ p.sku if p else '' }}" required></label>
      <label>Brand <input name="brand" value="{{ p.brand if p else '' }}" required></label>
    </div>
    <div class="form-row">
      <label>Category <input name="category" value="{{ p.category if p else '' }}" required></label>
      <label>Price ($) <input name="price" type="number" step="0.01" min="0"
        value="{{ '%.2f'|format(p.price_cents / 100) if p else '' }}" required></label>
    </div>
    <label>Stock <input name="stock" type="number" min="0" value="{{ p.stock if p else 0 }}" required></label>
    <label>Description <textarea name="description" rows="4" required>{{ p.description if p else '' }}</textarea></label>
    <button class="btn btn-wide" type="submit">Save product</button>
  </form>
</section>
{% endblock %}
