{% extends "base.html" %}
{% block title %}Create account — VOLTA{% endblock %}
{% block content %}
<section class="auth-card">
  <h1>Create account</h1>
  <form method="post">
    <label>Name <input type="text" name="name" required autofocus></label>
    <label>Email <input type="email" name="email" required></label>
    <label>Password <input type="password" name="password" minlength="8" required>
      <span class="fineprint">At least 8 characters.</span></label>
    <button class="btn btn-wide" type="submit">Create account</button>
  </form>
  <p class="fineprint">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a>.</p>
</section>
{% endblock %}
